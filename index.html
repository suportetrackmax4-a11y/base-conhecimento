<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de Conhecimento</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --texto: #1b2333; --suave: #5d6b82; --borda: #dde3ee;
  --destaque: #6c5ce7; --pele: #f2c9a0; --pele-sombra: #d9a77a; --cerebro: #f7a8c4; --cerebro-linha: #d0628a;
  --roupa: #3b4b6b; --codigo: #eef1f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --card: #182133; --texto: #e6ebf5; --suave: #93a1ba; --borda: #26324a;
    --destaque: #a294ff; --roupa: #5a6f9a; --codigo: #111a2a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --card: #182133; --texto: #e6ebf5; --suave: #93a1ba; --borda: #26324a;
  --destaque: #a294ff; --roupa: #5a6f9a; --codigo: #111a2a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--texto); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--destaque); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

header { display: flex; align-items: center; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
header .logo { font-weight: 700; font-size: 1.15rem; color: var(--texto); }
header .logo:hover { text-decoration: none; }
#busca { flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); font: inherit; }
.btn { display: inline-block; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--destaque); text-decoration: none; }
.btn.primario { background: var(--destaque); color: #fff; border-color: var(--destaque); }

.card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 18px; }

/* Cabeção */
.hero { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: center; }
.hero svg { width: 100%; height: auto; display: block; }
#cabeca { transition: transform 1.6s cubic-bezier(.2, 1.4, .4, 1); transform-origin: 150px 300px; transform-box: view-box; }
.pulsando #cranio { animation: pulso 2.4s ease-in-out infinite; transform-origin: 150px 240px; transform-box: view-box; }
@keyframes pulso { 50% { transform: scale(1.025); } }
.nivel { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }
.nivel-nome { font-size: 1.8rem; font-weight: 800; margin: 2px 0 6px; }
.barra { height: 10px; border-radius: 99px; background: var(--borda); overflow: hidden; margin: 10px 0 6px; }
.barra > div { height: 100%; background: var(--destaque); border-radius: 99px; transition: width 1.2s; }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: .9rem; color: var(--suave); }
.legenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }

h2 { font-size: 1.1rem; margin: 28px 0 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.area { display: block; color: var(--texto); border-top: 4px solid var(--c); }
.area:hover { text-decoration: none; border-color: var(--c); }
.area .icone { font-size: 1.6rem; }
.area b { display: block; margin-top: 4px; }
.area small { color: var(--suave); }

.lista { list-style: none; margin: 0; padding: 0; }
.lista li { border-bottom: 1px solid var(--borda); padding: 10px 0; }
.lista li:last-child { border-bottom: 0; }
.lista a { font-weight: 600; }
.meta { font-size: .85rem; color: var(--suave); }
.tag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 99px; background: var(--codigo); color: var(--suave); margin: 2px 4px 2px 0; cursor: pointer; }
.tag:hover { color: var(--destaque); }
.vazio { color: var(--suave); padding: 12px 0; }

/* Nota */
.nota { margin-top: 8px; }
.nota h1 { margin-top: 0; font-size: 1.6rem; line-height: 1.25; }
.nota pre { background: var(--codigo); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.nota code { background: var(--codigo); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
.nota pre code { background: none; padding: 0; }
.nota table { border-collapse: collapse; display: block; overflow-x: auto; }
.nota th, .nota td { border: 1px solid var(--borda); padding: 6px 10px; text-align: left; }
.nota blockquote { margin: 0; padding: 4px 14px; border-left: 4px solid var(--destaque); color: var(--suave); }
.nota img { max-width: 100%; }
.trilha { font-size: .9rem; color: var(--suave); margin: 4px 0 10px; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

@media (max-width: 640px) {
  .hero { grid-template-columns: 1fr; }
  .hero svg { max-width: 220px; margin: 0 auto; }
  .hero .info { text-align: center; }
  .legenda { justify-content: center; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#/">🧠 Base de Conhecimento</a>
    <input id="busca" type="search" placeholder="Buscar em tudo… (título, tag, conteúdo)" autocomplete="off">
  </header>
  <main id="app"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="notas.js"></script>
<script>
const REPO = 'suportetrackmax4-a11y/base-conhecimento';
const BASE = window.BASE || { areas: [], notas: [] };
const app = document.getElementById('app');
const busca = document.getElementById('busca');

const NIVEIS = [
  { min: 0,   nome: 'Cabeça vazia' },
  { min: 1,   nome: 'Aprendiz' },
  { min: 5,   nome: 'Curioso' },
  { min: 15,  nome: 'Estudioso' },
  { min: 30,  nome: 'Gênio' },
  { min: 60,  nome: 'Cérebro galáctico' },
  { min: 100, nome: 'Cabeção supremo' },
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const areaDe = id => BASE.areas.find(a => a.id === id) || { id, nome: id, icone: '🧠', cor: '#9b7bff' };
const dataBR = d => d ? d.split('-').reverse().join('/') : '';
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function nivelDe(n) {
  let i = 0;
  while (i + 1 < NIVEIS.length && n >= NIVEIS[i + 1].min) i++;
  return { i, atual: NIVEIS[i], prox: NIVEIS[i + 1] };
}

// Escala da cabeça: 1x com zero notas, cresce rápido no começo e tende a 2.4x
const escalaDe = n => 1 + 1.4 * (1 - Math.exp(-n / 40));

function cabecaoSVG(n) {
  const { i } = nivelDe(n);
  const dobras = i >= 2;          // dobras do cérebro aparecem a partir de "Curioso"
  const veias = i >= 4;           // veias saltando a partir de "Gênio"
  const brilho = i >= 5;          // aura a partir de "Cérebro galáctico"
  return `
  <svg viewBox="-20 0 340 360" role="img" aria-label="Personagem com cabeça proporcional ao conhecimento">
    <defs>
      <radialGradient id="aura"><stop offset="0" stop-color="var(--destaque)" stop-opacity=".45"/><stop offset="1" stop-color="var(--destaque)" stop-opacity="0"/></radialGradient>
      <clipPath id="clipCranio"><ellipse cx="150" cy="212" rx="62" ry="50"/></clipPath>
    </defs>
    <!-- corpo (não cresce) -->
    <path d="M95 360 Q98 318 128 310 L172 310 Q202 318 205 360 Z" fill="var(--roupa)"/>
    <rect x="140" y="292" width="20" height="22" rx="6" fill="var(--pele-sombra)"/>
    <g id="cabeca" style="transform: scale(1)">
      ${brilho ? '<circle cx="150" cy="240" r="88" fill="url(#aura)"/>' : ''}
      <g id="cranio">
        <ellipse cx="150" cy="240" rx="66" ry="62" fill="var(--pele)"/>
        ${dobras ? `
        <ellipse cx="150" cy="212" rx="62" ry="50" fill="var(--cerebro)" opacity=".9"/>
        <g clip-path="url(#clipCranio)" fill="none" stroke="var(--cerebro-linha)" stroke-width="2.4" stroke-linecap="round">
          <path d="M150 165 L150 262"/>
          <path d="M100 195 q12 -14 24 0 t24 0"/><path d="M152 195 q12 -14 24 0 t24 0"/>
          <path d="M94 222 q14 -12 26 2 t22 -4"/><path d="M158 220 q14 -12 26 2 t22 -4"/>
          <path d="M112 175 q10 8 22 -2"/><path d="M166 173 q10 8 22 -2"/>
        </g>` : ''}
        ${veias ? `
        <g fill="none" stroke="#e0507a" stroke-width="2" stroke-linecap="round">
          <path d="M104 236 l6 -6 l-2 -6 l6 -5"/><path d="M196 236 l-6 -6 l2 -6 l-6 -5"/>
        </g>` : ''}
        <!-- rosto -->
        <ellipse cx="130" cy="262" rx="5" ry="6" fill="#1b2333"/>
        <ellipse cx="170" cy="262" rx="5" ry="6" fill="#1b2333"/>
        <circle cx="132" cy="260" r="1.6" fill="#fff"/><circle cx="172" cy="260" r="1.6" fill="#fff"/>
        <path d="M138 282 q12 ${i >= 4 ? 10 : 6} 24 0" fill="none" stroke="#1b2333" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse cx="118" cy="276" rx="7" ry="4" fill="#e88" opacity=".35"/>
        <ellipse cx="182" cy="276" rx="7" ry="4" fill="#e88" opacity=".35"/>
      </g>
      ${brilho ? `<g fill="var(--destaque)"><circle cx="78" cy="170" r="3"/><circle cx="226" cy="160" r="2.4"/><circle cx="150" cy="150" r="2"/></g>` : ''}
    </g>
  </svg>`;
}

function linhaNota(n) {
  const a = areaDe(n.area);
  return `<li>
    <a href="#/nota/${n.area}/${n.slug}">${esc(n.titulo)}</a>
    <div class="meta">${a.icone} ${esc(a.nome)}${n.data ? ' · ' + dataBR(n.data) : ''}</div>
    <div>${n.tags.map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>
  </li>`;
}

function listaNotas(notas) {
  return notas.length ? `<ul class="lista">${notas.map(linhaNota).join('')}</ul>` : '<div class="vazio">Nada por aqui ainda.</div>';
}

function linkNovaNota(areaId) {
  const hoje = new Date().toISOString().slice(0, 10);
  const modelo = `---\ntitulo: \ntags: \ndata: ${hoje}\n---\n\n# \n\n`;
  return `https://github.com/${REPO}/new/main/notas/${areaId}?filename=nova-nota.md&value=${encodeURIComponent(modelo)}`;
}

function telaInicio() {
  const total = BASE.notas.length;
  const { atual, prox } = nivelDe(total);
  const pct = prox ? Math.round((total - atual.min) / (prox.min - atual.min) * 100) : 100;
  const porArea = a => BASE.notas.filter(n => n.area === a.id).length;

  app.innerHTML = `
    <section class="card hero">
      <div id="boneco">${cabecaoSVG(total)}</div>
      <div class="info">
        <div class="nivel">Nível ${nivelDe(total).i} · ${total} ${total === 1 ? 'nota' : 'notas'}</div>
        <div class="nivel-nome">${atual.nome}</div>
        ${prox
          ? `<div class="barra"><div style="width:0" data-w="${pct}%"></div></div>
             <div class="meta">Faltam <b>${prox.min - total}</b> para virar <b>${prox.nome}</b></div>`
          : `<div class="meta">Nível máximo. A cabeça não cabe mais na tela. 🤯</div>`}
        <div class="legenda">${BASE.areas.map(a => `<span style="--c:${a.cor}">${esc(a.nome)}: ${porArea(a)}</span>`).join('')}</div>
      </div>
    </section>

    <h2>Áreas</h2>
    <div class="grade">
      ${BASE.areas.map(a => `
        <a class="card area" style="--c:${a.cor}" href="#/area/${a.id}">
          <span class="icone">${a.icone}</span>
          <b>${esc(a.nome)}</b>
          <small>${porArea(a)} ${porArea(a) === 1 ? 'nota' : 'notas'}${a.descricao ? ' · ' + esc(a.descricao) : ''}</small>
        </a>`).join('')}
    </div>

    <h2>Últimas notas</h2>
    <div class="card">${listaNotas(BASE.notas.slice(0, 8))}</div>`;

  // Anima a cabeça crescendo do tamanho normal até o tamanho atual
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const cabeca = document.getElementById('cabeca');
    cabeca.style.transform = `scale(${escalaDe(total)})`;
    if (nivelDe(total).i >= 3) document.getElementById('boneco').classList.add('pulsando');
    const barra = app.querySelector('.barra > div');
    if (barra) barra.style.width = barra.dataset.w;
  }));
}

function telaArea(id) {
  const a = areaDe(id);
  const notas = BASE.notas.filter(n => n.area === id);
  app.innerHTML = `
    <div class="trilha"><a href="#/">Início</a> › ${esc(a.nome)}</div>
    <div class="card area" style="--c:${a.cor}">
      <span class="icone">${a.icone}</span>
      <b style="font-size:1.3rem">${esc(a.nome)}</b>
      <small>${notas.length} ${notas.length === 1 ? 'nota' : 'notas'}${a.descricao ? ' · ' + esc(a.descricao) : ''}</small>
    </div>
    <div class="acoes"><a class="btn primario" href="${linkNovaNota(id)}" target="_blank" rel="noopener">+ Nova nota nesta área</a></div>
    <h2>Notas</h2>
    <div class="card">${listaNotas(notas)}</div>`;
}

function telaNota(area, slug) {
  const n = BASE.notas.find(x => x.area === area && x.slug === slug);
  if (!n) { app.innerHTML = '<div class="card vazio">Nota não encontrada. <a href="#/">Voltar ao início</a></div>'; return; }
  const a = areaDe(area);
  const html = DOMPurify.sanitize(marked.parse(n.conteudo));
  app.innerHTML = `
    <div class="trilha"><a href="#/">Início</a> › <a href="#/area/${a.id}">${esc(a.nome)}</a></div>
    <article class="card nota">
      ${/^#\s/.test(n.conteudo) ? '' : `<h1>${esc(n.titulo)}</h1>`}
      ${html}
      <div class="meta" style="margin-top:16px">${n.data ? 'Escrita em ' + dataBR(n.data) + ' · ' : ''}${n.tags.map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>
    </article>
    <div class="acoes">
      <a class="btn" href="https://github.com/${REPO}/edit/main/notas/${a.id}/${n.slug}.md" target="_blank" rel="noopener">✏️ Editar no GitHub</a>
      <a class="btn" href="#/area/${a.id}">← Mais de ${esc(a.nome)}</a>
    </div>`;
  window.scrollTo(0, 0);
}

function telaBusca(termo) {
  const t = semAcento(termo.trim());
  const achou = BASE.notas.filter(n =>
    semAcento([n.titulo, n.tags.join(' '), n.conteudo, areaDe(n.area).nome].join(' ')).includes(t));
  app.innerHTML = `
    <h2>${achou.length} resultado${achou.length === 1 ? '' : 's'} para “${esc(termo)}”</h2>
    <div class="card">${listaNotas(achou)}</div>`;
}

function rota() {
  if (busca.value.trim()) return telaBusca(busca.value);
  const [, tipo, a, b] = location.hash.split('/');
  if (tipo === 'area' && a) telaArea(decodeURIComponent(a));
  else if (tipo === 'nota' && a && b) telaNota(decodeURIComponent(a), decodeURIComponent(b));
  else telaInicio();
}

busca.addEventListener('input', rota);
window.addEventListener('hashchange', () => { busca.value = ''; rota(); });
app.addEventListener('click', e => {
  const tag = e.target.closest('.tag');
  if (tag) { e.preventDefault(); busca.value = tag.dataset.tag; rota(); window.scrollTo(0, 0); }
});
rota();
</script>
</body>
</html>
