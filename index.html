<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base de Conhecimento</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --texto: #1b2333; --suave: #5d6b82; --borda: #dde3ee;
  --destaque: #6c5ce7; --pele: #f2c9a0; --pele-sombra: #d9a77a; --cerebro: #f7a8c4; --cerebro-linha: #d0628a;
  --roupa: #3b4b6b; --codigo: #eef1f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --card: #182133; --texto: #e6ebf5; --suave: #93a1ba; --borda: #26324a;
    --destaque: #a294ff; --roupa: #5a6f9a; --codigo: #111a2a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --card: #182133; --texto: #e6ebf5; --suave: #93a1ba; --borda: #26324a;
  --destaque: #a294ff; --roupa: #5a6f9a; --codigo: #111a2a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--texto); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--destaque); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

header { display: flex; align-items: center; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
header .logo { font-weight: 700; font-size: 1.15rem; color: var(--texto); }
header .logo:hover { text-decoration: none; }
#busca { flex: 1; min-width: 180px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); font: inherit; }
.btn { display: inline-block; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--card); color: var(--texto); font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--destaque); text-decoration: none; }
.btn.primario { background: var(--destaque); color: #fff; border-color: var(--destaque); }

.card { background: var(--card); border: 1px solid var(--borda); border-radius: 14px; padding: 18px; }

/* Cabeção */
.hero { display: grid; grid-template-columns: 260px 1fr; gap: 20px; align-items: center; }
.hero svg { width: 100%; height: auto; display: block; }
#cabeca { transition: transform 1.6s cubic-bezier(.2, 1.4, .4, 1); transform-origin: 150px 300px; transform-box: view-box; }
.pulsando #cranio { animation: pulso 2.4s ease-in-out infinite; transform-origin: 150px 240px; transform-box: view-box; }
@keyframes pulso { 50% { transform: scale(1.025); } }
.nivel { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }
.nivel-nome { font-size: 1.8rem; font-weight: 800; margin: 2px 0 6px; }
.barra { height: 10px; border-radius: 99px; background: var(--borda); overflow: hidden; margin: 10px 0 6px; }
.barra > div { height: 100%; background: var(--destaque); border-radius: 99px; transition: width 1.2s; }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; font-size: .9rem; color: var(--suave); }
.legenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }

h2 { font-size: 1.1rem; margin: 28px 0 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.area { display: block; color: var(--texto); border-top: 4px solid var(--c); }
.area:hover { text-decoration: none; border-color: var(--c); }
.area .icone { font-size: 1.6rem; }
.area b { display: block; margin-top: 4px; }
.area small { color: var(--suave); }

.lista { list-style: none; margin: 0; padding: 0; }
.lista li { border-bottom: 1px solid var(--borda); padding: 10px 0; }
.lista li:last-child { border-bottom: 0; }
.lista a { font-weight: 600; }
.meta { font-size: .85rem; color: var(--suave); }
.tag { display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 99px; background: var(--codigo); color: var(--suave); margin: 2px 4px 2px 0; cursor: pointer; }
.tag:hover { color: var(--destaque); }
.vazio { color: var(--suave); padding: 12px 0; }

/* Nota */
.nota { margin-top: 8px; }
.nota h1 { margin-top: 0; font-size: 1.6rem; line-height: 1.25; }
.nota pre { background: var(--codigo); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.nota code { background: var(--codigo); padding: 1px 5px; border-radius: 5px; font-size: .92em; }
.nota pre code { background: none; padding: 0; }
.nota table { border-collapse: collapse; display: block; overflow-x: auto; }
.nota th, .nota td { border: 1px solid var(--borda); padding: 6px 10px; text-align: left; }
.nota blockquote { margin: 0; padding: 4px 14px; border-left: 4px solid var(--destaque); color: var(--suave); }
.nota img { max-width: 100%; }
.trilha { font-size: .9rem; color: var(--suave); margin: 4px 0 10px; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

/* Editor */
.form { display: grid; gap: 14px; }
.form label { display: grid; gap: 6px; font-weight: 600; font-size: .92rem; }
.form input, .form select, .form textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--borda); background: var(--bg); color: var(--texto); font: inherit; font-weight: 400; }
.form textarea { min-height: 320px; font-family: ui-monospace, Consolas, monospace; font-size: .92rem; resize: vertical; }
.form .dica { font-weight: 400; color: var(--suave); font-size: .82rem; }
.linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.abas { display: flex; gap: 6px; }
.abas .btn.ativa { border-color: var(--destaque); color: var(--destaque); }
.aviso { padding: 10px 14px; border-radius: 10px; font-size: .92rem; }
.aviso.ok { background: color-mix(in srgb, #22a06b 15%, transparent); }
.aviso.erro { background: color-mix(in srgb, #e5484d 15%, transparent); }
.aviso.info { background: color-mix(in srgb, var(--destaque) 12%, transparent); }
.passos { margin: 0; padding-left: 20px; }
.passos li { margin: 4px 0; }

@media (max-width: 640px) {
  .linha2 { grid-template-columns: 1fr; }
  .hero { grid-template-columns: 1fr; }
  .hero svg { max-width: 220px; margin: 0 auto; }
  .hero .info { text-align: center; }
  .legenda { justify-content: center; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#/">🧠 Base de Conhecimento</a>
    <input id="busca" type="search" placeholder="Buscar em tudo… (título, tag, conteúdo)" autocomplete="off">
    <a class="btn primario" href="#/nova">+ Nova nota</a>
    <a class="btn" href="#/config" title="Conectar ao GitHub">⚙️</a>
  </header>
  <main id="app"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="notas.js"></script>
<script>
const REPO = 'suportetrackmax4-a11y/base-conhecimento';
const BASE = window.BASE || { areas: [], notas: [] };
const app = document.getElementById('app');
const busca = document.getElementById('busca');

// localStorage pode falhar (aba anônima, dados bloqueados): nunca deixar isso quebrar a página
const guardado = {
  ler(chave, padrao) { try { const v = localStorage.getItem(chave); return v === null ? padrao : JSON.parse(v); } catch { return padrao; } },
  gravar(chave, valor) { try { localStorage.setItem(chave, JSON.stringify(valor)); } catch {} },
};

// Notas salvas pelo site aparecem na hora, mesmo antes do GitHub regenerar o notas.js (~1 min)
function aplicarPendentes() {
  const geradoEm = BASE.geradoEm || '';
  const pendentes = guardado.ler('bc-pendentes', []).filter(p => p.salvoEm > geradoEm);
  guardado.gravar('bc-pendentes', pendentes);
  for (const p of pendentes) {
    const i = BASE.notas.findIndex(n => n.area === p.nota.area && n.slug === p.nota.slug);
    if (i >= 0) BASE.notas[i] = p.nota; else BASE.notas.unshift(p.nota);
    if (!BASE.areas.some(a => a.id === p.nota.area)) BASE.areas.push(p.area);
  }
}
aplicarPendentes();

const NIVEIS = [
  { min: 0,   nome: 'Cabeça vazia' },
  { min: 1,   nome: 'Aprendiz' },
  { min: 5,   nome: 'Curioso' },
  { min: 15,  nome: 'Estudioso' },
  { min: 30,  nome: 'Gênio' },
  { min: 60,  nome: 'Cérebro galáctico' },
  { min: 100, nome: 'Cabeção supremo' },
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const areaDe = id => BASE.areas.find(a => a.id === id) || { id, nome: id, icone: '🧠', cor: '#9b7bff' };
const dataBR = d => d ? d.split('-').reverse().join('/') : '';
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function nivelDe(n) {
  let i = 0;
  while (i + 1 < NIVEIS.length && n >= NIVEIS[i + 1].min) i++;
  return { i, atual: NIVEIS[i], prox: NIVEIS[i + 1] };
}

// Escala da cabeça: 1x com zero notas, cresce rápido no começo e tende a 2.4x
const escalaDe = n => 1 + 1.4 * (1 - Math.exp(-n / 40));

function cabecaoSVG(n) {
  const { i } = nivelDe(n);
  const dobras = i >= 2;          // dobras do cérebro aparecem a partir de "Curioso"
  const veias = i >= 4;           // veias saltando a partir de "Gênio"
  const brilho = i >= 5;          // aura a partir de "Cérebro galáctico"
  return `
  <svg viewBox="-20 0 340 360" role="img" aria-label="Personagem com cabeça proporcional ao conhecimento">
    <defs>
      <radialGradient id="aura"><stop offset="0" stop-color="var(--destaque)" stop-opacity=".45"/><stop offset="1" stop-color="var(--destaque)" stop-opacity="0"/></radialGradient>
      <clipPath id="clipCranio"><ellipse cx="150" cy="212" rx="62" ry="50"/></clipPath>
    </defs>
    <!-- corpo (não cresce) -->
    <path d="M95 360 Q98 318 128 310 L172 310 Q202 318 205 360 Z" fill="var(--roupa)"/>
    <rect x="140" y="292" width="20" height="22" rx="6" fill="var(--pele-sombra)"/>
    <g id="cabeca" style="transform: scale(1)">
      ${brilho ? '<circle cx="150" cy="240" r="88" fill="url(#aura)"/>' : ''}
      <g id="cranio">
        <ellipse cx="150" cy="240" rx="66" ry="62" fill="var(--pele)"/>
        ${dobras ? `
        <ellipse cx="150" cy="212" rx="62" ry="50" fill="var(--cerebro)" opacity=".9"/>
        <g clip-path="url(#clipCranio)" fill="none" stroke="var(--cerebro-linha)" stroke-width="2.4" stroke-linecap="round">
          <path d="M150 165 L150 262"/>
          <path d="M100 195 q12 -14 24 0 t24 0"/><path d="M152 195 q12 -14 24 0 t24 0"/>
          <path d="M94 222 q14 -12 26 2 t22 -4"/><path d="M158 220 q14 -12 26 2 t22 -4"/>
          <path d="M112 175 q10 8 22 -2"/><path d="M166 173 q10 8 22 -2"/>
        </g>` : ''}
        ${veias ? `
        <g fill="none" stroke="#e0507a" stroke-width="2" stroke-linecap="round">
          <path d="M104 236 l6 -6 l-2 -6 l6 -5"/><path d="M196 236 l-6 -6 l2 -6 l-6 -5"/>
        </g>` : ''}
        <!-- rosto -->
        <ellipse cx="130" cy="262" rx="5" ry="6" fill="#1b2333"/>
        <ellipse cx="170" cy="262" rx="5" ry="6" fill="#1b2333"/>
        <circle cx="132" cy="260" r="1.6" fill="#fff"/><circle cx="172" cy="260" r="1.6" fill="#fff"/>
        <path d="M138 282 q12 ${i >= 4 ? 10 : 6} 24 0" fill="none" stroke="#1b2333" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse cx="118" cy="276" rx="7" ry="4" fill="#e88" opacity=".35"/>
        <ellipse cx="182" cy="276" rx="7" ry="4" fill="#e88" opacity=".35"/>
      </g>
      ${brilho ? `<g fill="var(--destaque)"><circle cx="78" cy="170" r="3"/><circle cx="226" cy="160" r="2.4"/><circle cx="150" cy="150" r="2"/></g>` : ''}
    </g>
  </svg>`;
}

function linhaNota(n) {
  const a = areaDe(n.area);
  return `<li>
    <a href="#/nota/${n.area}/${n.slug}">${esc(n.titulo)}</a>
    <div class="meta">${a.icone} ${esc(a.nome)}${n.data ? ' · ' + dataBR(n.data) : ''}</div>
    <div>${n.tags.map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>
  </li>`;
}

function listaNotas(notas) {
  return notas.length ? `<ul class="lista">${notas.map(linhaNota).join('')}</ul>` : '<div class="vazio">Nada por aqui ainda.</div>';
}

const linkNovaNota = areaId => `#/nova/${areaId}`;

function telaInicio() {
  const total = BASE.notas.length;
  const { atual, prox } = nivelDe(total);
  const pct = prox ? Math.round((total - atual.min) / (prox.min - atual.min) * 100) : 100;
  const porArea = a => BASE.notas.filter(n => n.area === a.id).length;

  app.innerHTML = `
    <section class="card hero">
      <div id="boneco">${cabecaoSVG(total)}</div>
      <div class="info">
        <div class="nivel">Nível ${nivelDe(total).i} · ${total} ${total === 1 ? 'nota' : 'notas'}</div>
        <div class="nivel-nome">${atual.nome}</div>
        ${prox
          ? `<div class="barra"><div style="width:0" data-w="${pct}%"></div></div>
             <div class="meta">Faltam <b>${prox.min - total}</b> para virar <b>${prox.nome}</b></div>`
          : `<div class="meta">Nível máximo. A cabeça não cabe mais na tela. 🤯</div>`}
        <div class="legenda">${BASE.areas.map(a => `<span style="--c:${a.cor}">${esc(a.nome)}: ${porArea(a)}</span>`).join('')}</div>
      </div>
    </section>

    <h2>Áreas</h2>
    <div class="grade">
      ${BASE.areas.map(a => `
        <a class="card area" style="--c:${a.cor}" href="#/area/${a.id}">
          <span class="icone">${a.icone}</span>
          <b>${esc(a.nome)}</b>
          <small>${porArea(a)} ${porArea(a) === 1 ? 'nota' : 'notas'}${a.descricao ? ' · ' + esc(a.descricao) : ''}</small>
        </a>`).join('')}
    </div>

    <h2>Últimas notas</h2>
    <div class="card">${listaNotas(BASE.notas.slice(0, 8))}</div>`;

  // Anima a cabeça crescendo do tamanho normal até o tamanho atual
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const cabeca = document.getElementById('cabeca');
    cabeca.style.transform = `scale(${escalaDe(total)})`;
    if (nivelDe(total).i >= 3) document.getElementById('boneco').classList.add('pulsando');
    const barra = app.querySelector('.barra > div');
    if (barra) barra.style.width = barra.dataset.w;
  }));
}

function telaArea(id) {
  const a = areaDe(id);
  const notas = BASE.notas.filter(n => n.area === id);
  app.innerHTML = `
    <div class="trilha"><a href="#/">Início</a> › ${esc(a.nome)}</div>
    <div class="card area" style="--c:${a.cor}">
      <span class="icone">${a.icone}</span>
      <b style="font-size:1.3rem">${esc(a.nome)}</b>
      <small>${notas.length} ${notas.length === 1 ? 'nota' : 'notas'}${a.descricao ? ' · ' + esc(a.descricao) : ''}</small>
    </div>
    <div class="acoes"><a class="btn primario" href="${linkNovaNota(id)}">+ Nova nota nesta área</a></div>
    <h2>Notas</h2>
    <div class="card">${listaNotas(notas)}</div>`;
}

function telaNota(area, slug) {
  const n = BASE.notas.find(x => x.area === area && x.slug === slug);
  if (!n) { app.innerHTML = '<div class="card vazio">Nota não encontrada. <a href="#/">Voltar ao início</a></div>'; return; }
  const a = areaDe(area);
  const html = DOMPurify.sanitize(marked.parse(n.conteudo));
  app.innerHTML = `
    <div class="trilha"><a href="#/">Início</a> › <a href="#/area/${a.id}">${esc(a.nome)}</a></div>
    <article class="card nota">
      ${/^#\s/.test(n.conteudo) ? '' : `<h1>${esc(n.titulo)}</h1>`}
      ${html}
      <div class="meta" style="margin-top:16px">${n.data ? 'Escrita em ' + dataBR(n.data) + ' · ' : ''}${n.tags.map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}</div>
    </article>
    <div class="acoes">
      <a class="btn" href="#/editar/${a.id}/${n.slug}">✏️ Editar</a>
      <a class="btn" href="#/area/${a.id}">← Mais de ${esc(a.nome)}</a>
    </div>`;
  window.scrollTo(0, 0);
}

function telaBusca(termo) {
  const t = semAcento(termo.trim());
  const achou = BASE.notas.filter(n =>
    semAcento([n.titulo, n.tags.join(' '), n.conteudo, areaDe(n.area).nome].join(' ')).includes(t));
  app.innerHTML = `
    <h2>${achou.length} resultado${achou.length === 1 ? '' : 's'} para “${esc(termo)}”</h2>
    <div class="card">${listaNotas(achou)}</div>`;
}

// ---------- Gravação no GitHub ----------

const slugDe = s => semAcento(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'nota';
const base64 = texto => { const b = new TextEncoder().encode(texto); let s = ''; b.forEach(x => s += String.fromCharCode(x)); return btoa(s); };

async function github(caminho, opcoes = {}) {
  const token = guardado.ler('bc-token', '');
  const r = await fetch(`https://api.github.com/repos/${REPO}${caminho}`, {
    ...opcoes,
    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${token}`, ...(opcoes.headers || {}) },
  });
  if (r.status === 401) throw new Error('Token inválido ou expirado. Gere outro em ⚙️.');
  if (r.status === 403 || r.status === 404) throw new Error('O token não tem permissão de escrita neste repositório. Confira em ⚙️.');
  if (!r.ok) throw new Error(`GitHub respondeu ${r.status}.`);
  return r;
}

// Devolve { sha, texto } do arquivo no repositório, ou {} se ele ainda não existe
async function lerArquivo(caminho) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${caminho}?ref=main&t=${Date.now()}`, {
    headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${guardado.ler('bc-token', '')}` },
  });
  if (!r.ok) return {};
  const j = await r.json();
  const bytes = Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0));
  return { sha: j.sha, texto: new TextDecoder().decode(bytes) };
}

async function salvarArquivo(caminho, texto, mensagem) {
  // Para editar um arquivo existente o GitHub exige o "sha" da versão atual
  const { sha } = await lerArquivo(caminho);
  await github(`/contents/${caminho}`, {
    method: 'PUT',
    body: JSON.stringify({ message: mensagem, content: base64(texto), branch: 'main', ...(sha ? { sha } : {}) }),
  });
}

function telaConfig() {
  const temToken = !!guardado.ler('bc-token', '');
  app.innerHTML = `
    <div class="trilha"><a href="#/">Início</a> › Conectar ao GitHub</div>
    <section class="card form">
      <h2 style="margin:0">⚙️ Conectar ao GitHub</h2>
      <div class="aviso ${temToken ? 'ok' : 'info'}">${temToken ? '✅ Este navegador já está conectado. Pode criar e editar notas.' : 'Faça isso <b>uma vez em cada navegador</b> (PC, celular…). Depois é só escrever e salvar.'}</div>
      <ol class="passos">
        <li>Abra <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained token</a> (logado como <b>suportetrackmax4-a11y</b>).</li>
        <li><b>Token name:</b> base-conhecimento · <b>Expiration:</b> o que preferir (ex.: 1 ano).</li>
        <li><b>Repository access:</b> <i>Only select repositories</i> → <b>base-conhecimento</b>.</li>
        <li><b>Permissions → Repository → Contents:</b> <i>Read and write</i>.</li>
        <li>Clique em <b>Generate token</b>, copie e cole abaixo.</li>
      </ol>
      <label>Token
        <input id="token" type="password" placeholder="github_pat_…" autocomplete="off">
        <span class="dica">Fica guardado só neste navegador. Não compartilhe com ninguém.</span>
      </label>
      <div id="msg"></div>
      <div class="acoes" style="margin:0">
        <button class="btn primario" id="salvarToken">Conectar</button>
        ${temToken ? '<button class="btn" id="sair">Desconectar este navegador</button>' : ''}
      </div>
    </section>`;

  const msg = (tipo, t) => document.getElementById('msg').innerHTML = `<div class="aviso ${tipo}">${t}</div>`;
  document.getElementById('salvarToken').onclick = async () => {
    const token = document.getElementById('token').value.trim();
    if (!token) return msg('erro', 'Cole o token primeiro.');
    guardado.gravar('bc-token', token);
    try {
      const r = await github('');
      const repo = await r.json();
      if (!repo.permissions || !repo.permissions.push) throw new Error('O token não tem permissão de escrita (Contents: Read and write).');
      msg('ok', '✅ Conectado! Agora é só criar notas.');
      setTimeout(() => location.hash = '#/nova', 900);
    } catch (e) {
      guardado.gravar('bc-token', '');
      msg('erro', esc(e.message));
    }
  };
  const sair = document.getElementById('sair');
  if (sair) sair.onclick = () => { guardado.gravar('bc-token', ''); telaConfig(); };
}

function telaEditor(areaId, slug) {
  if (!guardado.ler('bc-token', '')) {
    app.innerHTML = `<div class="card"><div class="aviso info">Para salvar notas pelo site, conecte este navegador ao GitHub primeiro (só uma vez).</div>
      <div class="acoes"><a class="btn primario" href="#/config">⚙️ Conectar agora</a></div></div>`;
    return;
  }
  const editando = slug ? BASE.notas.find(n => n.area === areaId && n.slug === slug) : null;
  if (slug && !editando) { app.innerHTML = '<div class="card vazio">Nota não encontrada.</div>'; return; }
  const areaInicial = areaId || (BASE.areas[0] && BASE.areas[0].id);

  app.innerHTML = `
    <div class="trilha"><a href="#/">Início</a> › ${editando ? 'Editar nota' : 'Nova nota'}</div>
    <section class="card form">
      <div class="linha2">
        <label>Área
          <select id="area" ${editando ? 'disabled' : ''}>
            ${BASE.areas.map(a => `<option value="${a.id}" ${a.id === areaInicial ? 'selected' : ''}>${a.icone} ${esc(a.nome)}</option>`).join('')}
            <option value="__nova">➕ Criar área nova…</option>
          </select>
        </label>
        <label id="novaAreaBox" hidden>Nome da área nova
          <input id="novaArea" placeholder="Ex.: Rastreadores">
        </label>
      </div>
      <label>Título
        <input id="titulo" value="${editando ? esc(editando.titulo) : ''}" placeholder="Ex.: Como ler o IMEI pelo comando AT">
      </label>
      <label>Tags <span class="dica">separadas por vírgula</span>
        <input id="tags" value="${editando ? esc(editando.tags.join(', ')) : ''}" placeholder="Ex.: rastreador, at, modem">
      </label>
      <div class="abas"><button class="btn ativa" data-aba="escrever">✍️ Escrever</button><button class="btn" data-aba="ver">👁️ Ver como fica</button></div>
      <label id="boxTexto">Conteúdo <span class="dica">aceita Markdown: **negrito**, # título, - lista, \`código\`, tabelas…</span>
        <textarea id="texto" placeholder="Escreva com suas palavras…">${editando ? esc(editando.conteudo) : ''}</textarea>
      </label>
      <div id="previa" class="nota" hidden></div>
      <div id="msg"></div>
      <div class="acoes" style="margin:0">
        <button class="btn primario" id="salvar">💾 Salvar</button>
        <a class="btn" href="${editando ? `#/nota/${editando.area}/${editando.slug}` : '#/'}">Cancelar</a>
      </div>
    </section>`;

  const $ = id => document.getElementById(id);
  $('area').onchange = () => { $('novaAreaBox').hidden = $('area').value !== '__nova'; };
  app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => {
    const ver = b.dataset.aba === 'ver';
    app.querySelectorAll('[data-aba]').forEach(x => x.classList.toggle('ativa', x === b));
    $('boxTexto').hidden = ver; $('previa').hidden = !ver;
    if (ver) $('previa').innerHTML = DOMPurify.sanitize(marked.parse($('texto').value || '*Nada escrito ainda.*'));
  });

  const msg = (tipo, t) => $('msg').innerHTML = `<div class="aviso ${tipo}">${t}</div>`;
  $('salvar').onclick = async () => {
    const titulo = $('titulo').value.trim();
    const conteudo = $('texto').value.trim();
    if (!titulo) return msg('erro', 'Dê um título para a nota.');
    if (!conteudo) return msg('erro', 'Escreva alguma coisa no conteúdo.');

    let area;
    if (editando) area = areaDe(editando.area);
    else if ($('area').value === '__nova') {
      const nome = $('novaArea').value.trim();
      if (!nome) return msg('erro', 'Digite o nome da área nova.');
      area = { id: slugDe(nome), nome, icone: '🧠', cor: '#9b7bff', descricao: '' };
    } else area = areaDe($('area').value);

    let novoSlug = editando ? editando.slug : slugDe(titulo);
    if (!editando) { const b = novoSlug; let i = 2; while (BASE.notas.some(n => n.area === area.id && n.slug === novoSlug)) novoSlug = `${b}-${i++}`; }

    const tags = $('tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const data = editando && editando.data ? editando.data : new Date().toISOString().slice(0, 10);
    const arquivo = `---\ntitulo: ${titulo}\ntags: ${tags.join(', ')}\ndata: ${data}\n---\n\n${conteudo}\n`;

    $('salvar').disabled = true;
    msg('info', 'Salvando…');
    try {
      if (!BASE.areas.some(a => a.id === area.id)) {
        const { texto } = await lerArquivo('areas.json');
        const areas = texto ? JSON.parse(texto) : [];
        if (!areas.some(a => a.id === area.id)) {
          areas.push(area);
          await salvarArquivo('areas.json', JSON.stringify(areas, null, 2) + '\n', `Nova área: ${area.nome}`);
        }
      }
      await salvarArquivo(`notas/${area.id}/${novoSlug}.md`, arquivo, `${editando ? 'Edita' : 'Nova'} nota: ${titulo}`);
      const nota = { area: area.id, slug: novoSlug, titulo, tags, data, conteudo };
      const pendentes = guardado.ler('bc-pendentes', []).filter(p => !(p.nota.area === area.id && p.nota.slug === novoSlug));
      pendentes.push({ salvoEm: new Date().toISOString(), nota, area });
      guardado.gravar('bc-pendentes', pendentes);
      aplicarPendentes();
      location.hash = `#/nota/${area.id}/${novoSlug}`;
    } catch (e) {
      msg('erro', esc(e.message));
      $('salvar').disabled = false;
    }
  };
}

function rota() {
  if (busca.value.trim()) return telaBusca(busca.value);
  const [, tipo, a, b] = location.hash.split('/');
  if (tipo === 'config') telaConfig();
  else if (tipo === 'nova') telaEditor(a && decodeURIComponent(a));
  else if (tipo === 'editar' && a && b) telaEditor(decodeURIComponent(a), decodeURIComponent(b));
  else if (tipo === 'area' && a) telaArea(decodeURIComponent(a));
  else if (tipo === 'nota' && a && b) telaNota(decodeURIComponent(a), decodeURIComponent(b));
  else telaInicio();
}

busca.addEventListener('input', rota);
window.addEventListener('hashchange', () => { busca.value = ''; rota(); });
app.addEventListener('click', e => {
  const tag = e.target.closest('.tag');
  if (tag) { e.preventDefault(); busca.value = tag.dataset.tag; rota(); window.scrollTo(0, 0); }
});
rota();
</script>
</body>
</html>
