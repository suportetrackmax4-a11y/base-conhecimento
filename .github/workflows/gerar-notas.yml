# Quando uma nota é criada/editada (ex.: pelo site do GitHub), regenera o notas.js
name: Gerar notas.js

on:
  push:
    branches: [main]
    paths: ['notas/**', 'areas.json', 'build.js']

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notas.js
          git diff --cached --quiet || (git commit -m "Atualiza notas.js" && git push)
